name: urmoney-publish

on:
  schedule:
    # GitHub cron은 best-effort — 혼잡 시 수십 분~1시간+ 지연되고, 아예 누락되기도 한다
    # (8/7 실측 1h44m 지연 / 8/8 토요일 트리거 자체가 안 뜸 → 게시 실패).
    # 하루 1회 크론은 단일 실패점이므로, 30분마다 돌리고 "게시 시각이 지났는가"는
    # publish_from_plan.py의 POST_HOUR가 판단한다. done 마커가 있으면 즉시 종료(멱등).
    - cron: '5,35 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true면 게시 없이 토큰·계획 검증만'
        default: 'true'

permissions:
  contents: write

concurrency:
  group: urmoney-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Publish from plan
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/publish_from_plan.py
      - name: Commit done marker
        if: always()
        run: |
          git config user.name urmoney-bot
          git config user.email urmoney-bot@users.noreply.github.com
          git add -A done/ 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "publish done marker" && git push; }
