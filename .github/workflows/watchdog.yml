name: urmoney-watchdog

on:
  schedule:
    - cron: '35 14 * * *'  # 23:35 KST — 밤 생성(21:00/22:33) 후 내일 계획 확인
    - cron: '5 23 * * *'   # 08:05 KST — 정오 게시 전 오늘 계획 최종 확인
  workflow_dispatch:
    inputs:
      test_date:
        description: '테스트용 날짜(YYYY-MM-DD) — 없는 날짜를 주면 경고 메일 발송 테스트'
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check plan exists
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_DATE: ${{ github.event.inputs.test_date || '' }}
        run: python3 scripts/watchdog.py
