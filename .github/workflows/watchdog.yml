name: urmoney-watchdog

on:
  # 2026-09-20 예약 실행 전체 정지(사용자 요청). 수동 게시 기간에는 plans/<날짜>.json을
  # 만들지 않아서 세 체크가 전부 오탐이었다(08:05·12:35에 "계획 없음" 경고가 매일 2회 발송).
  # 재개하려면 아래 schedule 블록의 주석만 풀면 된다. 자동 게시로 돌아갈 때 반드시 되살릴 것.
  #   - 23:35 KST(35 14) 내일 계획 유무  ← 2026-09-08에 먼저 정지
  #   - 08:05 KST(5 23)  오늘 계획 유무
  #   - 12:35 KST(35 3)  오늘 게시 완료 여부
  # schedule:
  #   - cron: '35 14 * * *'
  #   - cron: '5 23 * * *'
  #   - cron: '35 3 * * *'
  workflow_dispatch:
    inputs:
      test_date:
        description: '테스트용 날짜(YYYY-MM-DD) — 없는 날짜를 주면 경고 메일 발송 테스트'
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check plan exists
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_DATE: ${{ github.event.inputs.test_date || '' }}
        run: python3 scripts/watchdog.py
